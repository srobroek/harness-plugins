name: release

# multi-semantic-release, one release per plugin. Manual until the first plugin exists:
# with no plugin, multi-semantic-release has nothing to release. Then add
#   push: { branches: [main] }
# and a release.config.mjs (see the harness-kit README, "Presets").

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: srobroek/harness-kit/.github/workflows/release.yml@v1.0.0
    permissions:
      contents: write
      issues: write
      pull-requests: write
