name: release

# multi-semantic-release, one release per plugin, tagged <name>--v<version>. It authenticates with the
# workflow's GITHUB_TOKEN. The release commit ([skip ci]) goes to main, so main must accept pushes from
# github-actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: srobroek/harness-kit/.github/workflows/release.yml@v1.9.0
    permissions:
      contents: write
      issues: write
      pull-requests: write
