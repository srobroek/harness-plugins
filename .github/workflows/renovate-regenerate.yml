name: renovate-regenerate

on:
  pull_request:
    types: [opened, synchronize]

permissions: {}

concurrency:
  group: renovate-regenerate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.head.repo.fork &&
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Skip an already regenerated head
        id: head
        run: |
          if [ "$(git log -1 --format=%s)" = 'chore(deps): regenerate generated copies' ]; then
            echo 'regenerate=false' >> "$GITHUB_OUTPUT"
          else
            echo 'regenerate=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.head.outputs.regenerate == 'true'
        with:
          node-version: "24"
          package-manager-cache: false
      # bun and just at the versions in .mise.toml. No cache: this job runs the PR's code.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        if: steps.head.outputs.regenerate == 'true'
        with:
          version: 2026.11.10
          cache: false
      - if: steps.head.outputs.regenerate == 'true'
        run: bun install --frozen-lockfile
      - if: steps.head.outputs.regenerate == 'true'
        run: just build
      - if: steps.head.outputs.regenerate == 'true'
        run: just check
      - name: Capture generated changes
        if: steps.head.outputs.regenerate == 'true'
        env:
          PATCH_PATH: ${{ runner.temp }}/regenerated.patch
        run: |
          git add --all
          git diff --cached --no-ext-diff --no-textconv --no-renames --full-index > "$PATCH_PATH"
      - name: Validate generated patch
        id: patch
        if: steps.head.outputs.regenerate == 'true'
        env:
          PATCH_PATH: ${{ runner.temp }}/regenerated.patch
          VALIDATE_MODE: build
        run: &validate-patch |
          python3 -I - << 'PY'
          import os
          import pathlib
          import re
          import subprocess
          import tempfile

          git_env = None
          def git(*args):
              return subprocess.check_output(["git", "-c", "core.hooksPath=/dev/null", *args], env=git_env)

          def allowed(name):
              parts = name.split("/")
              if any(part in ("", ".", "..", ".git") or not re.fullmatch(r"[A-Za-z0-9_.-]+", part) for part in parts):
                  return False
              if name.startswith("plugins/cad/common/"):
                  return False
              if name in ("INVENTORY.md", "inventory.json", ".claude-plugin/marketplace.json"):
                  return True
              if re.fullmatch(r"plugins/[^/]+/INVENTORY\.md", name):
                  return True
              if re.fullmatch(r"plugins/[^/]+/(opencode|claude)/(skills|agents|formulas|dist|_kit)/.+", name):
                  return True
              if re.fullmatch(r"plugins/[^/]+/(opencode|claude)/(package\.json|options\.json|\.mcp\.json)", name):
                  return True
              if re.fullmatch(r"plugins/[^/]+/claude/(\.claude-plugin/plugin\.json|hooks/(hooks\.json|agent-guard\.mjs|agent-guards\.json))", name):
                  return True
              if re.fullmatch(r"plugins/[^/]+/opencode/(index|tui|commit-msg|embedded-write-runner)\.js", name):
                  return True
              match = re.fullmatch(r"plugins/([^/]+)/common/agents/([^/]+)\.md", name)
              if match:
                  plugin, agent = match.groups()
                  if agent.endswith(".claude"):
                      base = agent.removesuffix(".claude")
                      return any(
                          subprocess.run(["git", "cat-file", "-e", f"HEAD:plugins/{plugin}/common/agents/{base}{suffix}.md"], check=False, stderr=subprocess.DEVNULL).returncode == 0
                          for suffix in (".opencode", "")
                      )
                  source = f"plugins/{plugin}/agents.src/{agent.removesuffix('.opencode')}.md"
                  return subprocess.run(["git", "cat-file", "-e", f"HEAD:{source}"], check=False, stderr=subprocess.DEVNULL).returncode == 0
              return False

          def copied_mode(name):
              match = re.fullmatch(r"plugins/([^/]+)/(opencode|claude)/(skills|agents|formulas)/(.+)", name)
              if not match:
                  return None
              plugin, _, directory, rest = match.groups()
              entry = git("ls-tree", "HEAD", "--", f"plugins/{plugin}/common/{directory}/{rest}")
              return entry.split(b" ", 1)[0].decode() if entry else None

          patch = pathlib.Path(os.environ["PATCH_PATH"])
          if not patch.is_file() or patch.is_symlink() or patch.stat().st_size > 64 * 1024 * 1024:
              raise SystemExit("patch must be a regular file of at most 64 MiB")
          text = patch.read_bytes().decode("utf-8")
          if "\x00" in text or "\nGIT binary patch\n" in text:
              raise SystemExit("only plain text patches are allowed")
          if re.search(r"^(rename from|rename to|copy from|copy to) ", text, re.MULTILINE):
              raise SystemExit("rename and copy metadata are forbidden")
          if not text:
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("changed=false\n")
              raise SystemExit(0)
          for record in git("apply", "--numstat", "-z", str(patch)).split(b"\x00"):
              if not record:
                  continue
              fields = record.decode("utf-8").split("\t", 2)
              if len(fields) != 3 or not fields[0].isdigit() or not fields[1].isdigit() or not allowed(fields[2]):
                  raise SystemExit("patch includes binary data, a rename, or a non-generated path")
          if os.environ["VALIDATE_MODE"] == "push":
              temporary_index = tempfile.TemporaryDirectory()
              git_env = os.environ | {"GIT_INDEX_FILE": str(pathlib.Path(temporary_index.name) / "index")}
              git("read-tree", "HEAD")
              git("apply", "--cached", "--check", str(patch))
              git("apply", "--cached", str(patch))
          records = git("diff", "--cached", "--raw", "--no-renames", "-z").split(b"\x00")
          for index in range(0, len(records) - 1, 2):
              old_mode, new_mode, _, _, status = records[index].decode().lstrip(":").split()
              name = records[index + 1].decode("utf-8")
              if not allowed(name) or status not in ("A", "M", "D"):
                  raise SystemExit("index includes a non-generated change")
              if old_mode not in ("000000", "100644", "100755") or new_mode not in ("000000", "100644", "100755"):
                  raise SystemExit("symlinks and special file modes are forbidden")
              executable = new_mode == "100755" or (old_mode == "100755" and new_mode != "000000")
              if executable and copied_mode(name) != new_mode:
                  raise SystemExit("executable copies must match their common source's mode")
          if os.environ["VALIDATE_MODE"] == "push":
              git_env = None
              temporary_index.cleanup()
              git("apply", "--index", "--check", str(patch))
              git("apply", "--index", str(patch))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("changed=true\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: steps.patch.outputs.changed == 'true'
        with:
          name: regenerated-patch-${{ github.run_attempt }}
          path: ${{ runner.temp }}/regenerated.patch
          if-no-files-found: error
          retention-days: 1

  push:
    needs: build
    if: >-
      needs.build.outputs.changed == 'true' &&
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.head.repo.fork &&
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/regenerated-artifact
      - name: Validate and apply generated patch
        id: patch
        env:
          PATCH_PATH: ${{ runner.temp }}/regenerated-artifact/regenerated.patch
          VALIDATE_MODE: push
        run: *validate-patch
      - name: Commit generated copies and dispatch CI on the new head
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh auth setup-git
          remote_head=$(git ls-remote origin "refs/heads/$PR_BRANCH" | cut -f1)
          if [ "$remote_head" != "$PR_HEAD" ]; then
            echo 'PR head changed; leaving regeneration to the next run.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false commit -m 'chore(deps): regenerate generated copies'
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$PR_BRANCH"
          run_id=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/dispatches" --method POST \
            -H 'X-GitHub-Api-Version: 2026-03-10' -f ref="$PR_BRANCH" --jq '.workflow_run_id')
          if [[ ! "$run_id" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo 'CI dispatch returned no valid run ID; cannot start its publisher.' >&2
            exit 1
          fi
          gh workflow run ci-publish.yml --ref "$DEFAULT_BRANCH" -f run_id="$run_id"
